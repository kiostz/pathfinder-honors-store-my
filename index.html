<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AY Store</title>
    <script>
      // Sets the saved theme before the first paint, so a buyer who picked Dark never sees a light flash.
      ;(function () {
        // keeps the names below out of the page's globals
        // blocked storage throws
        try {
          var theme = localStorage.getItem('pathfinder-honors-store-my:theme') // same key as theme-storage.ts
          if (theme === 'light' || theme === 'dark')
            document.documentElement.dataset.theme = theme // same attribute as use-theme.ts
        } catch (error) {
          // Storage is blocked: the page stays on System, as theme-storage.ts does.
        }
      })() // runs at once
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
